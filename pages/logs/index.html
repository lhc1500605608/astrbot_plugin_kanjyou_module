<!doctype html>
<html lang="zh-CN" data-page="logs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WarmWhisper · 暖语</title>
<style>
:root{
  --bg:#F7F5F0;--card:#FFFFFF;--fg:#26231F;--fg2:#5E5850;--muted:#8A8378;--line:#E7E2D8;--line2:#EFEBE3;
  --accent:#D97A4A;--accent-ink:#A9532A;--accent-soft:#FBEDE4;--ok:#2F9E5B;--ok-soft:#E3F4EA;--warn:#B7791F;--warn-soft:#FBF1DC;
  --bad:#C0392B;--bad-soft:#FBE6E3;--info:#3C6E9F;--info-soft:#E4EEF7;
  --shadow:0 1px 2px rgba(38,35,31,.04),0 4px 16px rgba(38,35,31,.05);--shadow-lg:0 20px 60px rgba(38,35,31,.18);
  --radius:14px;--serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",Georgia,serif;
  --sans:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme=dark]{
  --bg:#181614;--card:#211F1C;--fg:#F1ECE4;--fg2:#C6BEB2;--muted:#9A9184;--line:#36322D;--line2:#2C2925;
  --accent:#E68A5A;--accent-ink:#F0A47B;--accent-soft:#3A2A21;--ok:#4CC27B;--ok-soft:#1E3327;--warn:#E0A847;--warn-soft:#3A3020;
  --bad:#EF6B5C;--bad-soft:#3D2320;--info:#7FAEDB;--info-soft:#1F2C3A;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:232px;flex:none;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .2s}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 18px}
.mark{width:30px;height:30px;flex:none}
.brand b{font-family:var(--serif);font-size:16px;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--fg2);text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--line2);color:var(--fg)}
.nav button[aria-current=page]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav svg{width:17px;height:17px;flex:none}
.side-foot{padding:14px 18px;border-top:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.collapsed .side{width:64px}
.collapsed .side .lbl,.collapsed .brand div,.collapsed .side-foot .ver{display:none}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:9px;width:32px;height:32px;display:inline-grid;place-items:center;cursor:pointer;transition:border-color .15s,background .15s}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn svg{width:16px;height:16px}
/* main */
.main{flex:1;min-width:0;padding:28px 36px 90px;max-width:1280px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:26px}
h1{font-family:var(--serif);font-weight:600;font-size:28px;letter-spacing:.01em;margin:0 0 4px}
.sub{color:var(--muted);margin:0}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--fg2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill[data-s=live] .dot{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
.pill[data-s=connecting] .dot{background:var(--warn)}
.pill[data-s=offline] .dot,.pill[data-s=error] .dot{background:var(--bad)}
.pill[data-s=demo] .dot{background:var(--accent)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:9px;cursor:pointer;font-size:13px;transition:border-color .15s,background .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn svg{width:14px;height:14px}
.btn.sm{padding:4px 9px;font-size:12px}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.banner{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:18px;display:flex;gap:10px;align-items:flex-start;background:var(--card)}
.banner.demo{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent-ink)}
.banner.err{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--bad)}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card-h h2{font-size:15px;margin:0;font-weight:600}
.card-b{padding:18px 20px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:18px 20px}
.stat .k{color:var(--muted);font-size:12px;letter-spacing:.04em}
.stat .v{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.2;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .h{font-size:12px;color:var(--muted)}
.stat.bad .v{color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toggle-row{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:18px 20px;flex-wrap:wrap}
.switch{position:relative;width:44px;height:24px;border-radius:999px;background:var(--line);border:0;cursor:pointer;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked=true]{background:var(--ok)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.switch:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:12px;color:var(--muted)}
.input,select.input{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 11px;min-width:0;transition:border-color .15s}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.input[aria-invalid=true]{border-color:var(--bad)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--fg2);font-weight:500}
.err-t{font-size:12px;color:var(--bad);min-height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--card)}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--fg2)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:10px 14px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
tbody tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.name{font-weight:600}
.mini{font-size:12px;color:var(--muted);font-family:var(--mono)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--line2);color:var(--fg2);white-space:nowrap;font-weight:500}
.badge.private{background:var(--info-soft);color:var(--info)}
.badge.group{background:var(--accent-soft);color:var(--accent-ink)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.mood{display:flex;align-items:center;gap:8px;min-width:130px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#E9B04F)}
.num{font-variant-numeric:tabular-nums}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg2);font-weight:600;margin-bottom:4px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--line2),var(--line),var(--line2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.dec{display:flex;gap:12px;align-items:flex-start;padding:12px 20px;border-bottom:1px solid var(--line2)}
.dec:last-child{border-bottom:0}
.dec .t{width:88px;flex:none;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:2px}
.dec .b{flex:1;min-width:0}
.reasons{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.reason{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--fg2);cursor:help;background:var(--card)}
.wl-legacy td{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.help{font-size:13px;color:var(--fg2);line-height:1.7}
.help code{font-family:var(--mono);font-size:12px;background:var(--line2);padding:1px 6px;border-radius:5px}
/* drawer & dialog */
.scrim{position:fixed;inset:0;background:rgba(24,22,20,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line2)}
.drawer-b{padding:20px 22px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:20px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-all}
input[type=range]{width:100%;accent-color:var(--accent)}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--card);color:var(--fg);box-shadow:var(--shadow-lg);max-width:440px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(24,22,20,.4)}
.dlg-b{padding:22px 24px}
.dlg-b h3{margin:0 0 8px;font-family:var(--serif);font-size:18px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--line2)}
.toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;animation:tin .2s;max-width:360px}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.tabs{display:none}
@media (max-width:1000px){.grid4{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:820px){
  .side{display:none}.main{padding:20px 16px 90px}h1{font-size:22px}
  .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px;cursor:pointer;border-radius:8px}
  .tabs button[aria-current=page]{color:var(--accent-ink)}
  .tabs svg{width:18px;height:18px}
  .hide-m{display:none}
}
@media (max-width:640px){
  .sessions-table,.sessions-table tbody{display:block}.sessions-table thead{display:none}
  .sessions-table tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:10px;border-bottom:1px solid var(--line2)}
  .sessions-table td{display:block;border:0;padding:6px;min-width:0}.sessions-table td.hide-m{display:none}
  .sessions-table td:first-child,.sessions-table td:last-child{grid-column:1/-1}
  .sessions-table td[data-label]::before{content:attr(data-label) " · ";color:var(--muted);font-size:12px}
  .sessions-table .mini{overflow-wrap:anywhere}.sessions-table .mood{min-width:0}
  .btn,.iconbtn{min-height:40px}.tools .iconbtn{min-width:40px}.toasts{bottom:82px;left:16px;right:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="ww-app">
  <aside class="side" aria-label="主导航">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="14" r="6" fill="#D97A4A"/><g stroke="#D97A4A" stroke-width="1.8" stroke-linecap="round"><path d="M16 3v2.5M16 22.5V25M5 14h2.5M24.5 14H27M8.2 6.2l1.8 1.8M22 20l1.8 1.8M23.8 6.2 22 8M10 20l-1.8 1.8"/></g><path d="M9 26c3 2.5 11 2.5 14 0l-2 4z" fill="#D97A4A" opacity=".55"/></svg>
      <div><b>WarmWhisper</b><small>暖语 · 主动陪伴</small></div>
    </div>
    <nav class="nav" id="ww-nav"></nav>
    <div class="side-foot"><span class="ver">v2.13.5</span><button class="iconbtn" id="ww-collapse" aria-label="折叠侧栏" title="折叠侧栏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button></div>
  </aside>
  <main class="main" id="ww-main">
    <header class="top">
      <div><h1 id="ww-title">让每一次主动，都恰到好处。</h1><p class="sub" id="ww-sub"></p></div>
      <div class="tools">
        <span class="pill" id="ww-pill" data-s="connecting" role="status"><span class="dot"></span><span id="ww-pill-t">连接中</span></span>
        <button class="btn" id="ww-refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg><span id="ww-refresh-t">刷新</span></button>
        <button class="iconbtn" id="ww-lang" aria-label="切换语言" title="中文 / English" style="width:auto;padding:0 10px;font-size:12px">EN</button>
        <button class="iconbtn" id="ww-theme" aria-label="切换深色模式" title="深色模式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
    </header>
    <div id="ww-banners"></div>
    <div id="ww-view"></div>
  </main>
  <nav class="tabs" id="ww-tabs" aria-label="移动导航"></nav>
</div>
<div class="scrim" id="ww-scrim"></div>
<aside class="drawer" id="ww-drawer" role="dialog" aria-modal="true" aria-labelledby="ww-drawer-title" aria-hidden="true"></aside>
<dialog id="ww-dlg"><form method="dialog"><div class="dlg-b"><h3 id="ww-dlg-t"></h3><div id="ww-dlg-m" class="help"></div></div><div class="dlg-f"><button class="btn" value="cancel" id="ww-dlg-c">取消</button><button class="btn primary" value="ok" id="ww-dlg-ok">确认</button></div></form></dialog>
<div class="toasts" id="ww-toasts" aria-hidden="true"></div>
<div class="sr" id="ww-live" aria-live="polite" role="status"></div>
<div class="sr" id="ww-alert" aria-live="assertive" role="alert"></div>

<script>
(function () {
  'use strict';

  function getSdk() { return window.AstrBotPluginPage || null; }

  var _i18nDict = {};
  var _i18nReady = false;

  function _loadI18n() {
    if (_i18nReady) return;
    var sdk = getSdk();
    var locale = (sdk && sdk.locale) || (sdk && sdk.getLocale && sdk.getLocale()) || 'zh-CN';

      if (xhr.status === 200 || xhr.status === 0) {

      }
    } catch (e) {
      console.warn('[kanjyou] i18n load failed:', e);
    }
    _i18nReady = true;
  }

  function _resolveKey(key) {
    var parts = key.split('.');
    var obj = _i18nDict;
    for (var i = 0; i < parts.length; i++) {

  }

  function _interpolate(str, params) {
    if (!params || typeof str !== 'string') return str;
    return str.replace(/\{(\w+)\}/g, function (_, k) {
      return params[k] != null ? params[k] : '{' + k + '}';

  function t(key, params) {
    _loadI18n();
    var sdk = getSdk();
    if (sdk && typeof sdk.t === 'function') {

    var nodes = el.querySelectorAll('[data-i18n]');

      if (val !== key) node.textContent = val;

      if (!tKey) continue;
      var tVal = t(tKey);
      if (tVal !== tKey) tNode.title = tVal;
    }
  }

  function getTheme() {
    var attr = document.documentElement.getAttribute('data-theme');
    if (attr === 'light' || attr === 'dark') return attr;
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {

    }

  function onThemeChange(cb) {
    if (window.matchMedia) {

        }

    }
    var observer = new MutationObserver(function () {
      cb(getTheme());
    });
    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  }

  var KANJYOU = {
    get sdk() { return getSdk(); },
    t: t,
    applyI18n: applyI18n,
    getTheme: getTheme,
    onThemeChange: onThemeChange,

    async apiGet(path, params) {
      var sdk = getSdk();
      if (!sdk) return null;
      var ep = path.charAt(0) === '/' ? path.slice(1) : path;
      try {
        return await sdk.apiGet(ep, params || {});
      } catch (e) {
        console.error('[kanjyou] apiGet error:', ep, e);
        return null;
      }
    },

    subscribeSSE(path, onEvent, onStatus) {

      var ep = path.charAt(0) === '/' ? path.slice(1) : path;
      var closed = false;
      var subscriptionId = null;
      var subscriptionReady = false;
      var handlers = {
        onMessage: function(info) {
          if (!closed) onEvent(info);
        },

          if (!closed && onStatus) onStatus('connected');
        },
        onError: function() {
          if (!closed && onStatus) onStatus('disconnected');
        }

      function unsubscribe(id) {
        if (id == null) return;

          var result = sdk.unsubscribeSSE(id);
          if (result && typeof result.then === 'function') {

        }

        var subscription = sdk.subscribeSSE(ep, handlers);
        var pending = subscription && typeof subscription.then === 'function'
          ? subscription
          : Promise.resolve(subscription);
        pending.then(function (id) {
          if (closed) {
            unsubscribe(id);
            return;
          }
          subscriptionId = id;
          subscriptionReady = true;
        }).catch(function (e) {
          console.error('[kanjyou] subscribeSSE error:', ep, e);
          if (!closed && onStatus) onStatus('disconnected');
        });
      } catch (e) {
        console.error('[kanjyou] subscribeSSE error:', ep, e);
        if (onStatus) onStatus('disconnected');
      }

        close() {
          closed = true;
          if (!subscriptionReady) return;
          var id = subscriptionId;
          subscriptionId = null;
          subscriptionReady = false;
          unsubscribe(id);
        },

      var self = this;

      var heartbeatTimer = null;

      function resetHeartbeat() {
        if (heartbeatTimer) clearTimeout(heartbeatTimer);
        heartbeatTimer = setTimeout(function() {
          if (stopped) return;
          scheduleReconnect();

        if (stopped) return;
        if (handle) { try { handle.close(); } catch(e) {} }
        if (onStatus) onStatus('connecting');
        handle = self.subscribeSSE(path, function(data) {
          delay = baseDelay;
          resetHeartbeat();
          onEvent(data);
        }, onStatus);

      }

      function scheduleReconnect() {
        if (stopped) return;
        if (handle) { try { handle.close(); } catch(e) {} }
        if (heartbeatTimer) clearTimeout(heartbeatTimer);
        if (onStatus) onStatus('disconnected');

          delay = Math.min(delay * 2, maxDelay);

        }, delay);
      }

      connect();

      return {
        close() {
          stopped = true;
          if (timer) clearTimeout(timer);
          if (heartbeatTimer) clearTimeout(heartbeatTimer);
          if (handle) { try { handle.close(); } catch(e) {} }

        reconnect() {

          delay = baseDelay;

    },

      if (s < 3600) return Math.floor(s / 60) + 'm' + (s % 60 ? ' ' + (s % 60) + 's' : '');

      private: [JSON.stringify({ kind: "private", platform: "qq-bot-A", id: "42" }), JSON.stringify({ kind: "private", platform: "wx-home", id: "mom" }), JSON.stringify({ legacy_id: "7731" })],
      group: [JSON.stringify({ kind: "group", platform: "qq-bot-A", id: "1088" })],
    },
    recent: [],
  };
  const codesPool = [["idle_long", "timing_ok"], ["dnd"], ["cooldown"], ["user_active", "idle_short"], ["mood_low", "idle_long"], ["send_failed"], ["daily_cap"], ["not_whitelisted"], ["low_confidence"]];
  const mk = (i, at) => { const s = db.sessions[i % db.sessions.length]; const codes = codesPool[i % codesPool.length]; const outcome = codes.includes("send_failed") ? "failed" : codes.includes("timing_ok") ? "triggered" : codes.includes("mood_low") ? "allow" : "skip"; return { session_id: s.session_id, at: new Date(at * 1000).toISOString(), outcome, reason_codes: codes, confidence: Math.round((0.5 + ((i * 37) % 50) / 100) * 100) / 100, mode: i % 3 ? "heuristic" : "llm", idle_sec: s.idle_sec, mood: s.mood }; };
  for (let i = 0; i < 14; i++) db.recent.push(mk(i, now() - i * 640 - 30));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const ok = (data) => ({ ok: true, data: JSON.parse(JSON.stringify(data)) });
  const er = (m) => ({ ok: false, message: m });
  const hhmm = /^([01]\d|2[0-3]):[0-5]\d$/;
  return {
    mode: "demo",
    get: async (e) => { await wait(350); if (e === "status") return ok(db); return er("unknown endpoint"); },
    post: async (e, b) => {
      await wait(450);
      if (e === "toggle") { if (typeof b.enabled !== "boolean") return er("enabled must be boolean"); db.global.enabled = b.enabled; return ok({ enabled: b.enabled }); }
      if (e === "mood") { const s = db.sessions.find((x) => x.session_id === b.session_id); if (!s) return er("session not found"); if (!(b.value >= 0 && b.value <= 100)) return er("value out of range"); s.mood = b.value; return ok({ session_id: s.session_id, mood: s.mood }); }
      if (e === "test") { const s = db.sessions.find((x) => x.session_id === b.session_id); if (!s) return er("session not found"); db.recent.unshift({ ...mk(0, now()), session_id: s.session_id, reason_codes: ["manual"], outcome: "triggered" }); return ok({ triggered: true, session_id: s.session_id, attempt: { generation_status: "generated", generation_reason: "ok", delivery_status: "sent", receipt_status: "disabled", reason_code: "ok" } }); }
      if (e === "sleep") { if (!hhmm.test(b.start || "") || !hhmm.test(b.end || "")) return er("invalid HH:MM"); db.settings.sleep_start = b.start; db.settings.sleep_end = b.end; return ok({ start: b.start, end: b.end }); }
      if (e === "reload") return ok({ reloaded: true });
      if (e === "whitelist") {
        if (!["private", "group"].includes(b.kind) || !b.platform || !b.id) return er("kind/platform/id required");
        const key = JSON.stringify({ kind: b.kind, platform: b.platform, id: b.id }); const list = db.whitelist[b.kind];
        if (b.op === "add") { if (list.includes(key)) return er("already exists"); list.push(key); }
        else if (b.op === "del") { const i = list.indexOf(key); if (i < 0) return er("entry not found"); list.splice(i, 1); }
        else return er("bad op");
        return ok(db.whitelist);
      }
      return er("unknown endpoint");
    },
    sse: (onData, onStatus) => {
      onStatus("live"); let n = 20;
      const id = setInterval(() => { const r = mk(n++, now()); db.recent.unshift(r); db.recent.length = Math.min(db.recent.length, 60); onData({ data: JSON.stringify({ type: "decision", data: r }) }); }, 9000);
      return { close() { clearInterval(id); onStatus("offline"); }, reconnect() { onStatus("live"); } };
    },
  };
}

// A timed-out write may already have reached the server. Never retry it automatically.
const request = (method, endpoint, body) => new Promise((resolve) => {
  if (disposed) { resolve({ ok: false, message: "Page closed" }); return; }
  let done = false;
  const finish = result => { if (done) return; done = true; if (method === "post" && result?.ok) statusRevision++; clearTimeout(timer); timers.delete(timer); resolve(result); };
  const timer = setTimeout(() => finish({ ok: false, message: method === "post" ? L("请求超时，操作结果未知。请刷新状态确认后再操作。", "Request timed out; the result is unknown. Refresh before trying again.") : L("读取超时，请重试。", "Read timed out. Please retry.") }), endpoint === "test" ? 120000 : 15000);
  timers.add(timer);
  Promise.resolve().then(() => api[method](endpoint, body)).then(finish, error => finish({ ok: false, message: String(error?.message || error) }));
});

/* ---------------- data ---------------- */
const mergeDecisions = (incoming, existing = []) => {

    const key = JSON.stringify([row.session_id, row.at, row.outcome, row.reason_codes]);
    if (!unique.has(key)) unique.set(key, row);
  }
  return [...unique.values()].sort((a, b) => (toDate(b.at)?.getTime() || 0) - (toDate(a.at)?.getTime() || 0)).slice(0, 200);
};
const applySettings = (settings) => {

const applyStatus = (d) => { if (!d || typeof d !== "object") return; applySettings(d.settings); S.data = { sessions: d.sessions || [], global: d.global || {}, whitelist: d.whitelist || { private: [], group: [] }, recent: mergeDecisions(d.recent || [], S.data?.recent || []) }; S.loadError = null; };

  else { S.loadError = r.ok ? L("响应缺少会话数据", "Response missing sessions") : r.message; if (manual || api.mode !== "nohost") announce(L("加载失败：", "Load failed: ") + S.loadError, true); }
  softRender();
};
/* Unwrap SDK/facade wrappers until we reach the backend envelope {type, data}. */
const parseMaybe = (v) => { if (typeof v !== "string") return v; try { return JSON.parse(v); } catch (e) { return undefined; } };

  for (let i = 0; i < 5 && cur && typeof cur === "object"; i++) {
    if (cur.type === "status" || cur.type === "decision") return { type: cur.type, data: parseMaybe(cur.data) };
    if (cur.data !== undefined) { cur = parseMaybe(cur.data); continue; }
    break;
  }
  // last-resort fallbacks: SDK event name, or a bare status object
  const top = parseMaybe(msg);
  if (top && (top.event === "status" || top.event === "decision")) return { type: top.event, data: parseMaybe(top.data) };

};
/* Skip rebuilding the view while the user is editing; flush on focusout. */
let pendingRender = false;
const editing = () => { const a = document.activeElement; return !!(a && a.matches && (a.matches("input,select,textarea") || a.closest("form") || a.closest("#ww-drawer")) && (a.closest("#ww-view") || a.closest("#ww-drawer"))) || $("#ww-dlg").open; };

const onEvent = (msg) => {

    const ev = unwrapEvent(msg); if (!ev || !ev.data || typeof ev.data !== "object") return;
    if (ev.type === "status" && Array.isArray(ev.data.sessions)) { statusRevision++; applyStatus(ev.data); softRender(); }
    else if (ev.type === "decision" && ev.data.session_id) { if (!S.data) return; S.data.recent = mergeDecisions([ev.data], S.data.recent); if (S.section === "overview" || S.section === "logs") softRender(); }
  } catch (e) { /* ignore malformed / unknown */ }
};
const onConn = (st) => { const m = { open: "live", connected: "live", live: "live", connecting: "connecting", reconnecting: "connecting", error: "error", closed: "offline", offline: "offline", disconnected: "offline" }; S.conn = api.mode === "demo" ? (st === "offline" ? "offline" : "demo") : m[st] || "connecting"; if (S.section === "logs") softRender(); else renderChrome(); };
const connect = () => { if (sse) { try { sse.close(); } catch (e) {} } sse = api.sse(onEvent, onConn); if (!sse && api.mode !== "demo") { S.conn = "offline"; renderChrome(); } };

    case "ww-lang": lang = lang === "en" ? "zh" : "en"; storage.setItem("ww-lang", lang); render(); break;
    case "ww-theme": { const d = document.documentElement.dataset.theme === "dark" ? "" : "dark"; document.documentElement.dataset.theme = d; storage.setItem("ww-theme", d); break; }
    case "ww-dclose": closeDrawer(); break;
    case "ww-dtest": doTest(S.drawer.sid); break;
    case "ww-testbtn": if (S.testSid) doTest(S.testSid); break;
    case "ww-reconnect": if (sse && sse.reconnect) { S.conn = "connecting"; render(); sse.reconnect(); } else connect(); load(false); break;
    case "ww-sleep-reset": S.sleepForm = { ...S.sleepSaved }; S.sleepDirty = false; S.sleepErr = {}; render(); break;
    case "ww-reload": {
      if (S.busy.reload) return;
      if (!(await confirmDlg(L("重载配置与状态？", "Reload config & state?"), L("将重新读取已持久化的配置与状态，未持久化的内存变更可能丢失。", "Persisted config and state will be re-read; unpersisted changes may be lost."), L("重载", "Reload"), true))) return;
      setBusy("reload", true); const r = await request("post", "reload", {}); S.busy.reload = false;
      if (r.ok && r.data && r.data.reloaded === true) { announce(L("已重载", "Reloaded")); load(false); } else announce(L("重载失败：", "Reload failed: ") + (r.ok ? "reloaded≠true" : r.message), true);
      render(); break;
    }
  }
});
on($("#ww-scrim"), "click", closeDrawer);
on(document, "keydown", (e) => {
  if (!S.drawer || $("#ww-dlg").open) return;
  if (e.key === "Escape") { closeDrawer(); return; }
  if (e.key === "Tab") {
    const controls = [...$("#ww-drawer").querySelectorAll("button:not(:disabled),input:not(:disabled),select:not(:disabled),[tabindex='0']")];
    const first = controls[0], last = controls.at(-1);
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last?.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first?.focus(); }
  }
});
on(document, "input", (e) => {
  const id = e.target.id, v = e.target.value;
  if (id === "ww-q") { S.q = v; render(); }
  else if (id === "ww-logq") { S.logQ = v; render(); }
  else if (id === "wl-platform" || id === "wl-id") { S.wlForm[id.slice(3)] = v; }
  else if (id === "sl-start" || id === "sl-end") { S.sleepForm[id.slice(3)] = v; S.sleepDirty = true; const badge = $("#ww-sleepform")?.closest(".card")?.querySelector(".badge"); if (badge) badge.textContent = L("有未保存修改", "Unsaved changes"); }
  else if (id === "ww-mood-r") { S.drawer.mood = Number(v); $("#ww-mood-n").value = v; }
  else if (id === "ww-mood-n") { S.drawer.mood = v === "" ? "" : Number(v); if (v !== "" && Number(v) >= 0 && Number(v) <= 100) $("#ww-mood-r").value = v; }
});
on(document, "change", (e) => { if (e.target.id === "wl-kind") S.wlForm.kind = e.target.value; if (e.target.id === "ww-testsid") { S.testSid = e.target.value; render(); } });
on(document, "submit", async (e) => {
  const f = e.target;
  if (!["ww-wlform", "ww-sleepform", "ww-moodform"].includes(f.getAttribute("id"))) return;
  e.preventDefault();
  const busyKey = { "ww-wlform": "wl", "ww-sleepform": "sleep", "ww-moodform": "mood" }[f.getAttribute("id")];
  if (S.busy[busyKey]) return;
  if (f.getAttribute("id") === "ww-wlform") {
    const w = { kind: S.wlForm.kind, platform: S.wlForm.platform.trim(), id: S.wlForm.id.trim() }, err = {};
    if (!w.platform) err.platform = L("必填：确切的平台实例 ID", "Required: exact platform instance ID");
    else if (/[*?]/.test(w.platform) || w.platform === "all") err.platform = L("不支持通配平台", "Wildcard platforms not allowed");
    if (!w.id) err.id = L("必填：原生 ID", "Required: native ID");
    const key = JSON.stringify({ kind: w.kind, platform: w.platform, id: w.id });
    if (!err.platform && !err.id && S.data && (S.data.whitelist[w.kind] || []).some((r) => { const p = parseWl(r, w.kind); return p.scoped && p.kind === w.kind && p.platform === w.platform && p.id === w.id; })) err.form = L("该条目已存在", "Entry already exists");
    S.wlErr = err; if (Object.keys(err).length) { render(); announce(Object.values(err)[0], true); return; }
    setBusy("wl", true); const r = await request("post", "whitelist", { op: "add", ...w }); S.busy.wl = false;
    if (r.ok && r.data && Array.isArray(r.data.private) && Array.isArray(r.data.group)) { S.data.whitelist = r.data; S.wlForm = { kind: w.kind, platform: w.platform, id: "" }; announce(L("已添加到白名单", "Added to whitelist")); }
    else { S.wlErr = { form: r.ok ? L("响应格式无效", "Invalid response") : r.message }; announce(L("添加失败：", "Add failed: ") + S.wlErr.form, true); }
    render();
  } else if (f.getAttribute("id") === "ww-sleepform") {
    const s = { start: S.sleepForm.start.trim(), end: S.sleepForm.end.trim() }, err = {};
    if (!HHMM.test(s.start)) err.start = L("格式应为 HH:MM，如 23:00", "Use HH:MM, e.g. 23:00");
    if (!HHMM.test(s.end)) err.end = L("格式应为 HH:MM，如 08:00", "Use HH:MM, e.g. 08:00");
    S.sleepErr = err; if (Object.keys(err).length) { render(); announce(Object.values(err)[0], true); return; }
    setBusy("sleep", true); const r = await request("post", "sleep", s); S.busy.sleep = false;
    if (r.ok && r.data && HHMM.test(r.data.start) && HHMM.test(r.data.end)) { S.sleepSaved = { start: r.data.start, end: r.data.end }; S.sleepForm = { ...S.sleepSaved }; S.sleepDirty = false; announce(L("免打扰时段已保存", "DND saved")); }
    else { S.sleepErr = { form: r.ok ? L("响应格式无效", "Invalid response") : r.message }; announce(L("保存失败：", "Save failed: ") + S.sleepErr.form, true); }
    render();
  } else if (f.getAttribute("id") === "ww-moodform") {
    if (!S.drawer) return;
    const v = S.drawer.mood;
    if (v === "" || isNaN(v) || v < 0 || v > 100) { S.drawer.err = L("请输入 0 到 100 之间的数值", "Enter a value between 0 and 100"); renderDrawer(); announce(S.drawer.err, true); return; }
    const sid = S.drawer.sid; S.drawer.err = ""; setBusy("mood", true); const r = await request("post", "mood", { session_id: sid, value: Number(v) }); S.busy.mood = false;
    if (r.ok && r.data && r.data.session_id === sid && typeof r.data.mood === "number") { const s = sessionsOf().find((x) => x.session_id === sid); if (s) s.mood = r.data.mood; if (S.drawer?.sid === sid) S.drawer.mood = Math.round(r.data.mood); announce(L("情绪值已更新为 ", "Mood updated to ") + Math.round(r.data.mood)); }
    else { if (S.drawer?.sid === sid) S.drawer.err = r.ok ? L("响应格式无效", "Invalid response") : r.message; announce(L("保存失败：", "Save failed: ") + (S.drawer ? S.drawer.err : r.message), true); }
    render();
  }
});
window.addEventListener("pageshow", (event) => { if (event.persisted) location.reload(); });
on(window, "pagehide", () => { disposed = true; const dialog = $("#ww-dlg"); if (dialog.open) dialog.close("cancel"); if (sse) { try { sse.close(); } catch (e) {} sse = null; } timers.forEach((x) => { clearTimeout(x); clearInterval(x); }); timers.clear(); cleanups.splice(0).forEach((f) => f()); });

/* ---------------- boot ---------------- */
if (storage.getItem("ww-theme") === "dark" || (!storage.getItem("ww-theme") && matchMedia("(prefers-color-scheme: dark)").matches && storage.getItem("ww-theme") !== "")) document.documentElement.dataset.theme = "dark";
if (storage.getItem("ww-col") === "1") $("#ww-app").classList.add("collapsed");
on(document, "focusout", () => { setTimeout(() => { if (pendingRender && !editing()) { pendingRender = false; render(); } }, 0); });
const hasHost = () => !!(window.AstrBotPluginPage && typeof window.AstrBotPluginPage.apiGet === "function");
let booted = false;
const boot = () => {
  if (booted && api.mode !== "nohost") return; booted = true;
  api = makeApi();
  if (api.mode === "nohost") { S.loading = false; S.conn = "offline"; render(); return; }
  S.conn = api.mode === "demo" ? "demo" : "connecting"; load(false); connect();
};
render();
if (DEMO || hasHost()) boot();
else {
  const started = Date.now();
  const poll = setInterval(() => { if (hasHost() || Date.now() - started > 4000) { clearInterval(poll); timers.delete(poll); boot(); } }, 150);
  timers.add(poll);
  ["AstrBotPluginPageReady", "kanjyou:ready", "astrbot-plugin-page-ready"].forEach((n) => on(window, n, () => { if (hasHost()) { clearInterval(poll); boot(); } }));
}
}
</script>
</body>
